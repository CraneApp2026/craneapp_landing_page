<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraneApp — Панель управления</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Geologica', sans-serif; box-sizing: border-box; }
        body { 
            background: #080718; color: white; margin: 0; padding: 40px 20px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        
        /* ОБЩАЯ СТЕКЛЯННАЯ КАРТОЧКА (Liquid Glass) */
        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 40px; border-radius: 28px; width: 100%; 
            box-shadow: inset 0 20px 30px rgba(255,255,255,0.04), 0 20px 50px rgba(0,0,0,0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            transition: all 0.4s ease;
        }
        
        #auth-block { max-width: 400px; text-align: center; }
        #admin-block { max-width: 700px; display: none; } /* Скрыта по умолчанию */

        h1 { font-size: 2rem; font-weight: 700; margin-bottom: 30px; text-align: center; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .stat-box { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); 
            padding: 20px; border-radius: 16px; text-align: center;
        }
        .stat-title { font-size: 0.9rem; color: #94a3b8; margin-bottom: 5px; }
        .stat-num { font-size: 2.2rem; font-weight: 700; background: linear-gradient(180deg, #ffffff 0%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 8px rgba(168,85,247,0.4)); }
        .section-title { font-size: 1.2rem; font-weight: 700; margin: 30px 0 15px; color: #c084fc; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; padding-left: 5px; }
        
        input, textarea { 
            width: 100%; padding: 14px 20px; background: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; 
            color: white; font-size: 0.95rem; outline: none; transition: all 0.3s;
        }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, textarea:focus { border-color: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,0.2); }
        
        .btn-gradient { 
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 100%); color: white; 
            border: 1px solid rgba(255,255,255,0.2); padding: 16px; width: 100%; 
            font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer; 
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3); transition: all 0.3s; margin-top: 10px;
        }
        .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(99, 102, 241, 0.5); }
        .status { text-align: center; margin-top: 15px; font-weight: 500; }
    </style>
</head>
<body>

    <div id="auth-block" class="glass-card">
        <h1>🔒 Вход в систему</h1>
        <p style="color: #94a3b8; margin-bottom: 25px;">Доступ разрешен только администраторам CraneApp</p>
        <div class="form-group">
            <input type="password" id="auth-pass" placeholder="Введите ключ доступа" onkeydown="if(event.key==='Enter') login()">
        </div>
        <button class="btn-gradient" onclick="login()">Войти в панель</button>
        <div class="status" id="auth-status"></div>
    </div>

    <div id="admin-block" class="glass-card">
        <h1>⚙️ Управление CraneApp</h1>
        
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-title">👥 Уникальные заходы</div>
                <div class="stat-num" id="visit-val">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">📥 Всего скачиваний</div>
                <div class="stat-num" id="download-val">0</div>
            </div>
        </div>

        <div class="section-title">📊 Накрутка / Корректировка цифр</div>
        <div class="stats-grid">
            <div class="form-group">
                <label>Изменить заходы</label>
                <input type="number" id="input-visits">
            </div>
            <div class="form-group">
                <label>Изменить скачивания</label>
                <input type="number" id="input-downloads">
            </div>
        </div>

        <div class="section-title">✏️ Редактор текстов лендинга</div>
        <div class="form-group">
            <label>Главный заголовок (H1)</label>
            <textarea id="txt-heroTitle"></textarea>
        </div>
        <div class="form-group">
            <label>Подзаголовок</label>
            <textarea id="txt-heroSubtitle"></textarea>
        </div>
        <div class="stats-grid">
            <div class="form-group">
                <label>Текст кнопки 1</label>
                <input type="text" id="txt-btnInstall">
            </div>
            <div class="form-group">
                <label>Текст кнопки 2</label>
                <input type="text" id="txt-btnHowItWorks">
            </div>
        </div>
        <div class="form-group">
            <label>Текст над таймером</label>
            <input type="text" id="txt-timerTitle">
        </div>
        <div class="form-group">
            <label>Текст над счетчиком скачиваний</label>
            <input type="text" id="txt-counterTitle">
        </div>

        <button class="btn-gradient" onclick="saveChanges()">🚀 Применить изменения</button>
        <div class="status" id="status-msg"></div>
    </div>

    <script>
        const BACKEND_URL = 'https://craneapp-landing-page.vercel.app';
        let savedPassword = '';

        // Функция входа
        function login() {
            const passInput = document.getElementById('auth-pass').value;
            const authStatus = document.getElementById('auth-status');

            if (!passInput) {
                authStatus.innerText = "❌ Введите пароль!";
                authStatus.style.color = "#ef4444";
                return;
            }

            // Проверяем пароль, отправляя пустой тестовый запрос обновлений на бэкенд
            fetch(BACKEND_URL + '/api/admin/update-site', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: passInput })
            })
            .then(res => res.json())
            .then(data => {
                // Если бэкенд ругнулся на некорректные данные, но пароль ВЕРНЫЙ (статус не 403)
                // Или если он вернул success: true
                if (data.message !== "Неверный пароль!") {
                    savedPassword = passInput; // Запоминаем сессионный пароль
                    document.getElementById('auth-block').style.display = 'none';
                    document.getElementById('admin-block').style.display = 'block';
                    loadData(); // Грузим данные только после успешного входа
                } else {
                    authStatus.innerText = "❌ Неверный ключ доступа!";
                    authStatus.style.color = "#ef4444";
                }
            })
            .catch(() => {
                authStatus.innerText = "❌ Ошибка авторизации на сервере.";
                authStatus.style.color = "#ef4444";
            });
        }

        function loadData() {
            fetch(BACKEND_URL + '/api/get-site-data')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('download-val').innerText = data.totalDownloads;
                    document.getElementById('input-downloads').value = data.totalDownloads;
                    
                    for (let key in data.texts) {
                        const el = document.getElementById('txt-' + key);
                        if (el) el.value = data.texts[key];
                    }
                });

            fetch(BACKEND_URL + '/api/get-visits')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('visit-val').innerText = data.totalVisits;
                    document.getElementById('input-visits').value = data.totalVisits;
                })
                .catch(err => console.error(err));
        }

        function saveChanges() {
            const statusMsg = document.getElementById('status-msg');

            const updatedData = {
                password: savedPassword, // Используем сохраненный при логине пароль
                totalDownloads: parseInt(document.getElementById('input-downloads').value),
                totalVisits: parseInt(document.getElementById('input-visits').value),
                texts: {
                    heroTitle: document.getElementById('txt-heroTitle').value,
                    heroSubtitle: document.getElementById('txt-heroSubtitle').value,
                    btnInstall: document.getElementById('txt-btnInstall').value,
                    btnHowItWorks: document.getElementById('txt-btnHowItWorks').value,
                    timerTitle: document.getElementById('txt-timerTitle').value,
                    counterTitle: document.getElementById('txt-counterTitle').value,
                }
            };

            fetch(BACKEND_URL + '/api/admin/update-site', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedData)
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    statusMsg.innerText = "✅ " + data.message;
                    statusMsg.style.color = "#22c55e";
                    loadData();
                } else {
                    statusMsg.innerText = "❌ " + data.message;
                    statusMsg.style.color = "#ef4444";
                }
            })
            .catch(() => {
                statusMsg.innerText = "❌ Ошибка сохранения.";
                statusMsg.style.color = "#ef4444";
            });
        }
    </script>
</body>
</html>
