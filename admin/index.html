<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraneApp — Крипто-Панель</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Geologica', sans-serif; box-sizing: border-box; }
        body { 
            background: #0b0a1d; color: white; margin: 0; padding: 40px 20px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            overflow-x: hidden;
        }
        
        .glass-card {
            background: #131224;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px; border-radius: 24px; width: 100%; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: all 0.4s ease;
        }
        
        #auth-block { max-width: 420px; }
        #admin-block { max-width: 750px; display: none; }
        #totp-field-group { display: none; }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
        }
        .panel-header h1 { font-size: 1.85rem; font-weight: 700; margin: 0; color: #ffffff; }
        .panel-header h1 span { color: #b07ff0; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        
        .stat-box { 
            background: #18172c; 
            border: 1px solid rgba(255, 255, 255, 0.03); 
            padding: 22px 20px; border-radius: 16px; text-align: center;
        }
        .stat-title { font-size: 0.85rem; color: #7e7d9c; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .stat-num { font-size: 2.6rem; font-weight: 700; color: #b07ff0; }
        
        .section-title { font-size: 1.1rem; font-weight: 700; margin: 35px 0 20px; color: #b07ff0; display: flex; align-items: center; gap: 8px; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.85rem; color: #7e7d9c; margin-bottom: 10px; }
        
        input, textarea { 
            width: 100%; padding: 16px 20px; background: #0b0a1d; 
            border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; 
            color: white; font-size: 0.95rem; outline: none; transition: all 0.3s;
        }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, textarea:focus { border-color: #b07ff0; background: #0f0e26; }
        
        .btn-gradient { 
            background: #8b5cf6; color: white; border: none; padding: 18px; width: 100%; 
            font-size: 1.05rem; font-weight: 600; border-radius: 50px; cursor: pointer; 
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3); transition: all 0.3s; margin-top: 15px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-gradient:hover { transform: translateY(-1px); box-shadow: 0 15px 30px rgba(139, 92, 246, 0.45); }
        
        .status { text-align: center; margin-top: 18px; font-weight: 500; font-size: 0.95rem; min-height: 24px; }

        #reset-btn { 
            background: #ef4444; margin-top: 20px; width: 100%; 
            padding: 16px; border-radius: 50px; color: white; border: none; 
            cursor: pointer; font-weight: 600; font-size: 1rem; 
            transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        #reset-btn:hover { background: #dc2626; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 7, 24, 0.75); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-card {
            background: #131224; border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 35px; border-radius: 24px; max-width: 440px; width: 90%;
            text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            transform: translateY(20px); transition: all 0.3s ease;
        }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        
        .modal-icon { font-size: 3rem; margin-bottom: 15px; display: inline-block; }
        .modal-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 12px; color: white; }
        .modal-text { font-size: 0.95rem; color: #7e7d9c; margin-bottom: 25px; line-height: 1.5; }
        
        .modal-buttons { display: flex; gap: 15px; justify-content: center; }
        .modal-btn {
            padding: 14px 28px; border-radius: 50px; font-weight: 600; font-size: 0.95rem;
            cursor: pointer; border: none; transition: all 0.2s; min-width: 120px;
        }
        .modal-btn.confirm { background: #8b5cf6; color: white; }
        .modal-btn.confirm:hover { background: #7c3aed; }
        .modal-btn.cancel { background: #1c1a36; color: #7e7d9c; border: 1px solid rgba(255,255,255,0.05); }
        .modal-btn.cancel:hover { background: #252347; color: white; }
    </style>
</head>
<body>

    <div id="auth-block" class="glass-card">
        <div class="panel-header"><h1>🔒 Авторизация</h1></div>
        <div id="credentials-fields">
            <div class="form-group">
                <label>Логин оператора</label>
                <input type="text" id="auth-user" placeholder="Админ-имя">
            </div>
            <div class="form-group">
                <label>Криптографический ключ</label>
                <input type="password" id="auth-pass" placeholder="Ввод...">
            </div>
            <button class="btn-gradient" onclick="verifyCredentials()">Войти в систему</button>
        </div>
        <div id="totp-field-group">
            <div class="form-group">
                <label>Токен TOTP (6 цифр)</label>
                <input type="text" id="auth-totp" placeholder="000000" maxlength="6" onkeydown="if(event.key==='Enter') verifyTwoFactor()">
            </div>
            <button class="btn-gradient" onclick="verifyTwoFactor()">Подтвердить</button>
        </div>
        <div class="status" id="auth-status"></div>
    </div>

    <div id="admin-block" class="glass-card">
        <div class="panel-header">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" fill="white"/><path fill-rule="evenodd" clip-rule="evenodd" d="M19.43 12.98C19.47 12.66 19.5 12.34 19.5 12C19.5 11.66 19.47 11.34 19.43 11.02L21.54 9.37C21.73 9.22 21.78 8.95 21.66 8.73L19.66 5.27C19.54 5.05 19.27 4.97 19.05 5.05L16.56 6.05C16.04 5.66 15.48 5.33 14.88 5.08L14.51 2.42C14.46 2.18 14.25 2 14 2H10C9.75 2 9.54 2.18 9.49 2.42L9.12 5.08C8.52 5.33 7.96 5.66 7.44 6.05L4.95 5.05C4.73 4.97 4.46 5.05 4.34 5.27L2.34 8.73C2.21 8.95 2.27 9.22 2.46 9.37L4.57 11.02C4.53 11.34 4.5 11.67 4.5 12C4.5 12.33 4.53 12.66 4.57 12.98L2.46 14.63C2.27 14.78 2.22 15.05 2.34 15.27L4.34 18.73C4.46 18.95 4.73 19.03 4.95 18.95L7.44 17.95C7.96 18.34 8.52 18.67 9.12 18.92L9.49 21.58C9.54 21.82 9.75 22 10 22H14C14.25 22 14.46 21.82 14.51 21.58L14.88 18.92C15.48 18.67 16.04 18.34 16.56 17.95L19.05 18.95C19.27 19.03 19.54 18.95 19.66 18.73L21.66 15.27C21.78 15.05 21.73 14.78 21.54 14.63L19.43 12.98ZM12 15.5C13.933 15.5 15.5 13.933 15.5 12C15.5 10.067 13.933 8.5 12 8.5C10.067 8.5 8.5 10.067 8.5 12C8.5 13.933 10.067 15.5 12 15.5Z" fill="white"/></svg>
            <h1>Панель управления <span>CraneApp</span></h1>
        </div>
        
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-title">🎥 Уникальные заходы</div>
                <div class="stat-num" id="visit-val">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">🕹️ Всего скачиваний</div>
                <div class="stat-num" id="download-val">0</div>
            </div>
        </div>

        <div class="section-title">📊 Накрутка / Корректировка цифр</div>
        <div class="stats-grid">
            <div class="form-group">
                <label>Изменить заходы</label>
                <input type="number" id="input-visits" value="0">
            </div>
            <div class="form-group">
                <label>Изменить скачивания</label>
                <input type="number" id="input-downloads" value="0">
            </div>
        </div>

        <div class="section-title">📝 Редактор текстов лендинга</div>
        <div class="form-group">
            <label>Главный заголовок (H1)</label>
            <textarea id="txt-heroTitle"></textarea>
        </div>
        <div class="form-group">
            <label>Подзаголовок</label>
            <textarea id="txt-heroSubtitle"></textarea>
        </div>
        <div class="stats-grid">
            <div class="form-group">
                <label>Текст кнопки 1</label>
                <input type="text" id="txt-btnInstall">
            </div>
            <div class="form-group">
                <label>Текст кнопки 2</label>
                <input type="text" id="txt-btnHowItWorks">
            </div>
        </div>
        <div class="form-group">
            <label>Текст над таймером</label>
            <input type="text" id="txt-timerTitle">
        </div>
        <div class="form-group">
            <label>Текст над счетчиком скачиваний</label>
            <input type="text" id="txt-counterTitle">
        </div>

        <button class="btn-gradient" onclick="saveChanges()">🚀 Сохранить в облако</button>
        <div class="status" id="status-msg"></div>

        <button id="reset-btn" onclick="showResetConfirmation()">
            🔄 Сбросить к начальным значениям (в 0)
        </button>
    </div>

    <div id="custom-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-icon" id="modal-icon">⚠️</div>
            <div class="modal-title" id="modal-title">Подтверждение</div>
            <div class="modal-text" id="modal-text">Вы уверены, что хотите выполнить это действие?</div>
            <div class="modal-buttons" id="modal-buttons-container">
                </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://craneapp-landing-page.vercel.app';
        let currentUsername = '';
        let globalSessionToken = '';

        const defaultTexts = {
            heroTitle: "Мессенджер, созданный для вашей безопасности.",
            heroSubtitle: "Пока крупные корпорации монетизируют персональные данные, три разработчика из Новокузнецка создали альтернативу.",
            btnInstall: "Установить приложение",
            btnHowItWorks: "Как это работает?",
            timerTitle: "До релиза осталось:",
            counterTitle: "Скачиваний приложения по всему миру:"
        };

        function openModal({ icon, title, text, showCancel, onConfirm }) {
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerText = text;
            
            const btnContainer = document.getElementById('modal-buttons-container');
            btnContainer.innerHTML = '';

            if (showCancel) {
                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'modal-btn cancel';
                cancelBtn.innerText = 'Нет';
                cancelBtn.onclick = closeModal;
                btnContainer.appendChild(cancelBtn);
            }

            const confirmBtn = document.createElement('button');
            confirmBtn.className = 'modal-btn confirm';
            confirmBtn.innerText = showCancel ? 'Да' : 'Отлично';
            confirmBtn.onclick = () => {
                closeModal();
                if (onConfirm) onConfirm();
            };
            btnContainer.appendChild(confirmBtn);

            document.getElementById('custom-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.remove('active');
        }

        function verifyCredentials() {
            currentUsername = document.getElementById('auth-user').value;
            const pass = document.getElementById('auth-pass').value;
            const status = document.getElementById('auth-status');
            status.innerText = "";

            fetch(BACKEND_URL + '/api/admin/login-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername, password: pass })
            })
            .then(res => res.json().then(data => ({ status: res.status, data })))
            .then(({ status: httpStatus, data }) => {
                if (data.success) {
                    document.getElementById('credentials-fields').style.display = 'none';
                    document.getElementById('totp-field-group').style.display = 'block';
                } else if (httpStatus === 429) {
                    status.innerText = "⏳ Слишком много попыток. Подождите 15 минут.";
                    status.style.color = "#ef4444";
                } else {
                    status.innerText = "❌ " + (data.message || "Ошибка авторизации");
                    status.style.color = "#ef4444";
                }
            }).catch(() => { 
                status.innerText = "❌ Не удалось связаться с сервером"; 
                status.style.color = "#ef4444";
            });
        }

        function verifyTwoFactor() {
            const code = document.getElementById('auth-totp').value;
            fetch(BACKEND_URL + '/api/admin/verify-2fa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername, code: code })
            })
            .then(res => res.json().then(data => ({ status: res.status, data })))
            .then(({ status: httpStatus, data }) => {
                if(data.success) {
                    globalSessionToken = data.sessionToken;
                    localStorage.setItem('crane_session', data.sessionToken);
                    document.getElementById('auth-block').style.display = 'none';
                    document.getElementById('admin-block').style.display = 'block';
                    loadData();
                } else if (httpStatus === 429) {
                    document.getElementById('auth-status').innerText = "⏳ Слишком много попыток. Подождите 15 минут.";
                } else {
                    document.getElementById('auth-status').innerText = "❌ " + (data.message || "Неверный код 2FA");
                }
            }).catch(() => {
                document.getElementById('auth-status').innerText = "❌ Ошибка проверки 2FA";
            });
        }

        function loadData() {
            for (let key in defaultTexts) {
                const el = document.getElementById('txt-' + key);
                if (el) el.value = defaultTexts[key];
            }

            fetch(BACKEND_URL + '/api/get-site-data')
                .then(res => res.json())
                .then(data => {
                    if(data) {
                        document.getElementById('download-val').innerText = data.totalDownloads || 0;
                        document.getElementById('visit-val').innerText = data.totalVisits || 0;
                        document.getElementById('input-downloads').value = data.totalDownloads || 0;
                        document.getElementById('input-visits').value = data.totalVisits || 0;
                        
                        if (data.texts) {
                            for (let key in defaultTexts) {
                                const el = document.getElementById('txt-' + key);
                                if (el && data.texts[key]) el.value = data.texts[key];
                            }
                        }
                    }
                })
                .catch(() => {
                    console.log("Локальный режим безопасности активирован (сервер офлайн).");
                });
        }

        function saveChanges() {
            const statusMsg = document.getElementById('status-msg');
            statusMsg.innerText = "⏳ Сохранение...";
            statusMsg.style.color = "#b07ff0";
            
            const updatedData = {
                sessionToken: globalSessionToken,
                totalDownloads: parseInt(document.getElementById('input-downloads').value) || 0,
                totalVisits: parseInt(document.getElementById('input-visits').value) || 0,
                texts: {
                    heroTitle: document.getElementById('txt-heroTitle').value || defaultTexts.heroTitle,
                    heroSubtitle: document.getElementById('txt-heroSubtitle').value || defaultTexts.heroSubtitle,
                    btnInstall: document.getElementById('txt-btnInstall').value || defaultTexts.btnInstall,
                    btnHowItWorks: document.getElementById('txt-btnHowItWorks').value || defaultTexts.btnHowItWorks,
                    timerTitle: document.getElementById('txt-timerTitle').value || defaultTexts.timerTitle,
                    counterTitle: document.getElementById('txt-counterTitle').value || defaultTexts.counterTitle,
                }
            };

            fetch(BACKEND_URL + '/api/admin/update-site', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedData)
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    statusMsg.innerText = "✅ Изменения успешно применены!"; 
                    statusMsg.style.color = "#22c55e";
                    openModal({
                        icon: "🚀",
                        title: "Успешно!",
                        text: "Данные отправлены в облако и сохранены.",
                        showCancel: false
                    });
                } else {
                    statusMsg.innerText = "❌ Ошибка сохранения";
                    statusMsg.style.color = "#ef4444";
                }
            })
            .catch(() => {
                statusMsg.innerText = "❌ Сервер не отвечает. Изменения не сохранены.";
                statusMsg.style.color = "#ef4444";
                openModal({
                    icon: "📡",
                    title: "Ошибка сети",
                    text: "Не удалось связаться с сервером Vercel. Проверьте соединение или бэкенд.",
                    showCancel: false
                });
            });
        }

        function showResetConfirmation() {
            openModal({
                icon: "⚠️",
                title: "Сброс данных",
                text: "Вы уверены, что хотите сбросить все тексты и счетчики к начальным значениям (в 0)?",
                showCancel: true,
                onConfirm: executeReset
            });
        }

        async function executeReset() {
            const statusMsg = document.getElementById('status-msg');
            try {
                const response = await fetch(`${BACKEND_URL}/api/admin/reset-site`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionToken: globalSessionToken })
                });
                const data = await response.json();

                if (data.success) {
                    loadData();
                    openModal({ icon: "🔄", title: "Сброшено!", text: "Все параметры успешно сброшены в исходное состояние.", showCancel: false });
                } else {
                    alert('Ошибка: ' + data.message);
                }
            } catch (error) {
                openModal({
                    icon: "📡",
                    title: "Ошибка сети",
                    text: "Не удалось связаться с сервером для сброса параметров.",
                    showCancel: false
                });
            }
        }

        window.onload = function() {
            const savedToken = localStorage.getItem('crane_session');
            if (savedToken) {
                globalSessionToken = savedToken;
                document.getElementById('auth-block').style.display = 'none';
                document.getElementById('admin-block').style.display = 'block';
                loadData();
            }
        };
    </script>
</body>
</html>
