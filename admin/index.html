<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraneApp — Крипто-Панель</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Geologica', sans-serif; box-sizing: border-box; }
        body { 
            background: #080718; color: white; margin: 0; padding: 40px 20px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        
       
        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 40px; border-radius: 28px; width: 100%; 
            box-shadow: inset 0 20px 30px rgba(255,255,255,0.04), 0 20px 50px rgba(0,0,0,0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            transition: all 0.4s ease;
        }
        
        #auth-block { max-width: 420px; }
        #admin-block { max-width: 750px; display: none; } /* Скрыта по умолчанию */

        h1 { font-size: 1.8rem; font-weight: 700; text-align: center; margin-top: 0; background: linear-gradient(90deg, #fff, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .stat-box { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); 
            padding: 20px; border-radius: 16px; text-align: center;
        }
        .stat-title { font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; }
        .stat-num { font-size: 2.2rem; font-weight: 700; color: #c084fc; filter: drop-shadow(0 0 8px rgba(168,85,247,0.4)); }
        .section-title { font-size: 1.2rem; font-weight: 700; margin: 30px 0 15px; color: #c084fc; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; padding-left: 4px; }
        
        input, textarea { 
            width: 100%; padding: 14px 20px; background: rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; 
            color: white; font-size: 0.95rem; outline: none; transition: all 0.3s;
        }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, textarea:focus { border-color: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,0.2); }
        
        .btn-gradient { 
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 100%); color: white; 
            border: 1px solid rgba(255,255,255,0.2); padding: 16px; width: 100%; 
            font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer; 
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3); transition: all 0.3s; margin-top: 10px;
        }
        .btn-gradient:hover { transform: translateY(-1px); box-shadow: 0 15px 30px rgba(99, 102, 241, 0.5); }
        .status { text-align: center; margin-top: 15px; font-weight: 500; font-size: 0.9rem; }

        #qr-container { text-align: center; margin: 20px 0; display: none; }
        #qr-container img { background: white; padding: 10px; border-radius: 14px; width: 180px; height: 180px; box-shadow: 0 0 20px rgba(255,255,255,0.1); }
        #totp-field-group { display: none; }
    </style>
</head>
<body>

    <div id="auth-block" class="glass-card">
        <h1>🔒 Авторизация ядра</h1>
        
        <div id="credentials-fields">
            <div class="form-group">
                <label>Идентификатор оператора (Логин)</label>
                <input type="text" id="auth-user" placeholder="Админ-имя">
            </div>
            <div class="form-group">
                <label>Криптографический ключ (Пароль)</label>
                <input type="password" id="auth-pass" placeholder="10-12 символов">
            </div>
            <button class="btn-gradient" onclick="verifyCredentials()">Запросить доступ</button>
        </div>

        <div id="qr-container">
            <p style="font-size:0.85rem; color:#a78bfa; margin-bottom: 15px;">⚠️ Обязательная привязка 2FA.<br>Сканируйте QR в Google Authenticator:</p>
            <img id="qr-img" src="" alt="2FA QR">
        </div>

        <div id="totp-field-group">
            <div class="form-group">
                <label>Временный токен TOTP (из приложения)</label>
                <input type="text" id="auth-totp" placeholder="000000" maxlength="6" onkeydown="if(event.key==='Enter') verifyTwoFactor()">
            </div>
            <button class="btn-gradient" onclick="verifyTwoFactor()">Подтвердить токен</button>
        </div>

        <div class="status" id="auth-status"></div>
    </div>

    <div id="admin-block" class="glass-card">
        <h1>⚙️ Панель управления CraneApp</h1>
        
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-title">👥 Уникальные заходы</div>
                <div class="stat-num" id="visit-val">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">📥 Всего скачиваний</div>
                <div class="stat-num" id="download-val">0</div>
            </div>
        </div>

        <div class="section-title">📊 Накрутка / Корректировка цифр</div>
        <div class="stats-grid">
            <div class="form-group">
                <label>Изменить заходы</label>
                <input type="number" id="input-visits">
            </div>
            <div class="form-group">
                <label>Изменить скачивания</label>
                <input type="number" id="input-downloads">
            </div>
        </div>

        <div class="section-title">✏️ Редактор текстов лендинга</div>
        <div class="form-group">
            <label>Главный заголовок (H1)</label>
            <textarea id="txt-heroTitle"></textarea>
        </div>
        <div class="form-group">
            <label>Подзаголовок</label>
            <textarea id="txt-heroSubtitle"></textarea>
        </div>
        <div class="stats-grid">
            <div class="form-group">
                <label>Текст кнопки 1</label>
                <input type="text" id="txt-btnInstall">
            </div>
            <div class="form-group">
                <label>Текст кнопки 2</label>
                <input type="text" id="txt-btnHowItWorks">
            </div>
        </div>
        <div class="form-group">
            <label>Текст над таймером</label>
            <input type="text" id="txt-timerTitle">
        </div>
        <div class="form-group">
            <label>Текст над счетчиком скачиваний</label>
            <input type="text" id="txt-counterTitle">
        </div>

        <button class="btn-gradient" onclick="saveChanges()">🚀 Сохранить в облако</button>
        <div class="status" id="status-msg"></div>
    </div>

    <script>
        const BACKEND_URL = 'https://craneapp-landing-page.vercel.app';
        let currentUsername = '';
        let globalSessionToken = '';

        
        function verifyCredentials() {
            currentUsername = document.getElementById('auth-user').value;
            const pass = document.getElementById('auth-pass').value;
            const status = document.getElementById('auth-status');

            if(!currentUsername || !pass) {
                status.innerText = "❌ Заполните все поля!"; 
                status.style.color = "#ef4444"; 
                return;
            }

            fetch(BACKEND_URL + '/api/admin/login-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername, password: pass })
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error("Неверные учетные данные");
                }
                return res.json();
            })
            .then(data => {
                if (data.success) {
                    status.innerText = "";
                    
                    document.getElementById('credentials-fields').style.display = 'none';
                    document.getElementById('totp-field-group').style.display = 'block';

                    
                    if (data.step === "setup_2fa") {
                        document.getElementById('qr-img').src = data.qrCode;
                        document.getElementById('qr-container').style.display = 'block';
                    }
                }
            })
            .catch(() => { 
                status.innerText = "❌ Доступ отклонен (Проверьте логин/пароль)"; 
                status.style.color = "#ef4444"; 
            });
        }

        
        function verifyTwoFactor() {
            const code = document.getElementById('auth-totp').value;
            const status = document.getElementById('auth-status');

            if(!code || code.length !== 6) {
                status.innerText = "❌ Токен должен состоять из 6 цифр!";
                status.style.color = "#ef4444";
                return;
            }

            fetch(BACKEND_URL + '/api/admin/verify-2fa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername, code: code })
            })
            .then(res => {
                if (!res.ok) throw new Error();
                return res.json();
            })
            .then(data => {
                if(data.success) {
                    globalSessionToken = data.sessionToken;
localStorage.setItem('crane_session', data.sessionToken);
                    document.getElementById('auth-block').style.display = 'none';
                    document.getElementById('admin-block').style.display = 'block';
                    loadData();
                }
            })
            .catch(() => {
                status.innerText = "❌ Ошибка: Неверный 2FA-токен!"; 
                status.style.color = "#ef4444";
            });
        }

        function loadData() {
            fetch(BACKEND_URL + '/api/get-site-data')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('download-val').innerText = data.totalDownloads;
                    document.getElementById('input-downloads').value = data.totalDownloads;
                    for (let key in data.texts) {
                        const el = document.getElementById('txt-' + key);
                        if (el) el.value = data.texts[key];
                    }
                });

            fetch(BACKEND_URL + '/api/get-visits')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('visit-val').innerText = data.totalVisits;
                    document.getElementById('input-visits').value = data.totalVisits;
                });
        }

        function saveChanges() {
            const statusMsg = document.getElementById('status-msg');
            const updatedData = {
                sessionToken: globalSessionToken, // Валидируем операцию подписью сессии
                totalDownloads: parseInt(document.getElementById('input-downloads').value),
                totalVisits: parseInt(document.getElementById('input-visits').value),
                texts: {
                    heroTitle: document.getElementById('txt-heroTitle').value,
                    heroSubtitle: document.getElementById('txt-heroSubtitle').value,
                    btnInstall: document.getElementById('txt-btnInstall').value,
                    btnHowItWorks: document.getElementById('txt-btnHowItWorks').value,
                    timerTitle: document.getElementById('txt-timerTitle').value,
                    counterTitle: document.getElementById('txt-counterTitle').value,
                }
            };

            fetch(BACKEND_URL + '/api/admin/update-site', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedData)
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    statusMsg.innerText = "✅ Изменения успешно применены!"; 
                    statusMsg.style.color = "#22c55e";
                    loadData();
                } else {
                    statusMsg.innerText = "❌ " + data.message; 
                    statusMsg.style.color = "#ef4444";
                }
            })
            .catch(() => {
                statusMsg.innerText = "❌ Не удалось сохранить данные."; 
                statusMsg.style.color = "#ef4444";
            });
        }
        // Автоматически подтягиваем токен при старте страницы
window.onload = function() {
    const savedToken = localStorage.getItem('crane_session');
    if (savedToken) {
        globalSessionToken = savedToken;
        // Если токен есть, можно сразу пробовать загрузить данные
        document.getElementById('auth-block').style.display = 'none';
        document.getElementById('admin-block').style.display = 'block';
        loadData();
    }
};
    </script>
</body>
</html>
